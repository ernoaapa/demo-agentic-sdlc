agents:
  planner:
    harness: codex
    triggers:
      - event: issues
        action: labeled
        label: "ai-plan"
    instructions: |
      Read the issue and
      post a short implementation plan as a comment on the issue.
      Include acceptance criteria and suggested tests.

  # Temporary: checks git through the egress gateway (airohq/agentic-sdlc#107).
  git-push-claude:
    harness: claude
    network:
      allowed: [github]
    triggers:
      - event: issues
        action: labeled
        label: "test-push-claude"
    instructions: |
      Test git over HTTPS. Run these commands in a shell and report the exact
      output of each, including errors, in one comment on the issue. Don't
      set a git user name or email, and don't use the GitHub MCP tools for
      these steps, only git.
      1. git --version; git config --list --show-origin | grep -v helper
      2. git clone https://github.com/ernoaapa/demo-agentic-sdlc.git /tmp/repo
      3. In /tmp/repo: create branch auth-test-claude-<issue number>, add a file
         auth-test.txt containing the issue number, commit it, and show
         git log -1 --format='%an <%ae>'.
      4. git push origin HEAD

  # Temporary: checks git through the egress gateway (airohq/agentic-sdlc#107).
  git-anon-claude:
    harness: claude
    network:
      allowed: [github]
    auth:
      github.com: none
    triggers:
      - event: issues
        action: labeled
        label: "test-anon-claude"
    instructions: |
      Test git over HTTPS. Run these commands in a shell and report the exact
      output of each, including errors, in one comment on the issue. Don't
      set a git user name or email, and don't use the GitHub MCP tools for
      these steps, only git.
      1. git --version; git config --list --show-origin | grep -v helper
      2. git clone https://github.com/ernoaapa/demo-agentic-sdlc.git /tmp/repo
      3. In /tmp/repo: create branch auth-test-anon-<issue number>, add a file
         auth-test.txt containing the issue number, commit it, and show
         git log -1 --format='%an <%ae>'.
      4. git push origin HEAD. A failed push is expected.

  # Temporary: checks git through the egress gateway (airohq/agentic-sdlc#107).
  git-push-claude-go:
    harness: claude-go
    network:
      allowed: [github]
    triggers:
      - event: issues
        action: labeled
        label: "test-push-claude-go"
    instructions: |
      Test git over HTTPS. Run these commands in a shell and report the exact
      output of each, including errors, in one comment on the issue. Don't
      set a git user name or email, and don't use the GitHub MCP tools for
      these steps, only git.
      1. git --version; git config --list --show-origin | grep -v helper
      2. git clone https://github.com/ernoaapa/demo-agentic-sdlc.git /tmp/repo
      3. In /tmp/repo: create branch auth-test-claude-go-<issue number>, add a file
         auth-test.txt containing the issue number, commit it, and show
         git log -1 --format='%an <%ae>'.
      4. git push origin HEAD
